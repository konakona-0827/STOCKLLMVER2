[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "japan-support-desk"
version = "0.11.0"
description = "日股三代理尋標、H-001機會研究、公開財報查找與可重播決策（無下單）"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
support-desk = "support_scout.__main__:main"
japan-support-desk = "support_scout.__main__:main"

[tool.setuptools.packages.find]
include = ["support_scout*"]
