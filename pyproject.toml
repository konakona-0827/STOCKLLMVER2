[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "japan-support-desk"
version = "0.4.0"
description = "日股確認支撐決策：Yahoo Finance、獨立雙代理與可稽核 Head of Desk（無下單）"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
support-desk = "support_scout.__main__:main"
japan-support-desk = "support_scout.__main__:main"

[tool.setuptools.packages.find]
include = ["support_scout*"]
