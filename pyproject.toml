[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-scout"
version = "0.1.0"
description = "可重播、證據優先的台股支撐候選研究骨架"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
support-scout = "support_scout.__main__:main"

[tool.setuptools.packages.find]
include = ["support_scout*"]
