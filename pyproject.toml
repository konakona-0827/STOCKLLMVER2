[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-desk"
version = "0.4.0"
description = "台股主動尋標：工具型尋標子代理、獨立研究與反證審查"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
support-desk = "support_scout.__main__:main"

[tool.setuptools.packages.find]
include = ["support_scout*"]
