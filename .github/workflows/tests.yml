name: support-desk-tests
on: [push, pull_request]
jobs:
  unit:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m support_scout desk-demo --out output/ci-demo
      - run: python -m support_scout discovery-demo --out output/ci-discovery
      - run: python -c "from pathlib import Path; from support_scout.discovery_workflow import replay_discovery; print(replay_discovery(next(Path('output/ci-discovery').glob('*/market.json')).parent))"
