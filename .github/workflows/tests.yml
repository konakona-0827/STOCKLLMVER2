name: japan-support-desk-tests
on: [push, pull_request]
jobs:
  unit:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m support_scout desk-demo --out output/ci-demo
      - run: python -m support_scout japan-demo --out output/ci-japan-demo
