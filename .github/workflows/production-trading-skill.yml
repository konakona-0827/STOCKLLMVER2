name: Production Trading Skill Gates
on:
  push:
    branches: ['codex/production-trading-skill']
    paths: ['opportunity_flow/**', 'operations/account_transfer.py', 'account-share/**', 'bounded_cli_capture.py', 'codex_cli.py', 'skills/tw-production-decision/**', 'config/trading_skill.json', 'tests/**', 'RunSkillTrading.ps1', 'SkillTrading*.cmd', '.github/workflows/production-trading-skill.yml']
  pull_request:
    paths: ['opportunity_flow/**', 'operations/account_transfer.py', 'account-share/**', 'bounded_cli_capture.py', 'codex_cli.py', 'skills/tw-production-decision/**', 'config/trading_skill.json', 'tests/**', 'RunSkillTrading.ps1', 'SkillTrading*.cmd', '.github/workflows/production-trading-skill.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-windows-gates:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Tested Python dependencies
        run: python -m pip install openai==3.8.0 openai-agents==0.23.1 jsonschema==4.26.0 comtypes==1.4.17 truststore==0.10.4 certifi==2025.6.15
      - name: Unit, integration, leakage, accounting, execution safety and regressions
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Account handoff archive integrity
        run: python -X utf8 -m operations.account_transfer inspect
