name: Trading Skills Paper Research
on:
  pull_request:
    paths: ['research/**', 'skills/tw-trading-decision/**', 'skills/tw-paper-decision/**', 'tests/test_trading_skills.py', 'tests/test_llm_paper*.py', '.github/workflows/trading-skills-research.yml']
  push:
    paths: ['research/**', 'skills/tw-trading-decision/**', 'skills/tw-paper-decision/**', 'tests/test_trading_skills.py', 'tests/test_llm_paper*.py', '.github/workflows/trading-skills-research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-paper-gates:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Unit, Integration, Future Leakage, Accounting, Paper Safety
        run: python -m unittest discover -s tests -p test_trading_skills.py -v
      - name: Existing selection and label regressions
        run: |
          python -m unittest discover -s tests -p test_selection_lab.py -v
          python -m unittest discover -s tests -p test_multi_horizon_research.py -v
      - name: Formal LLM matched replay and quote-only paper gates
        run: python -m unittest discover -s tests -p 'test_llm_paper*.py' -v
